<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2b33"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#f0782a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9ee"/>
    </linearGradient>
  </defs>
  <!-- fond, identique à Agent Profiles -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
  <!-- deux skills en arrière-plan -->
  <rect x="140" y="112" width="232" height="80" rx="24" fill="#3b3c44"/>
  <rect x="116" y="150" width="280" height="84" rx="28" fill="#5a5b64"/>
  <!-- skill au premier plan : nom, source, puis la rangée des agents qui la lisent -->
  <rect x="92" y="196" width="328" height="196" rx="38" fill="url(#card)"/>  <rect x="136" y="240" width="132" height="22" rx="11" fill="#1b1c21"/>
  <rect x="136" y="278" width="84" height="16" rx="8" fill="#1b1c21" fill-opacity="0.32"/>
  <circle cx="150" cy="340" r="15" fill="#1b1c21"/>
  <circle cx="194" cy="340" r="15" fill="#1b1c21"/>
  <circle cx="238" cy="340" r="15" fill="#1b1c21"/>
  <!-- l'agent auquel on propage la skill -->
  <path d="M282 325 v30 M267 340 h30" stroke="url(#acc)" stroke-width="10" stroke-linecap="round"/>
</svg>
